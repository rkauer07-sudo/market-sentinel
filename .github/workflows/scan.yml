name: Continuous market scan

on:
  push:
    branches: [main]
  schedule:
    # The next shift is queued well before the active 5h30 shift finishes.
    # GitHub schedule jitter therefore cannot create 20-35 minute data gaps.
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: market-scan
  # A deployment must replace the old worker immediately. Scheduled handoffs
  # remain queued and never interrupt the active writer.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: sentinel
      SUPABASE_DB_OBJECT: sentinel.db
      SYNC_DB_UPLOAD: "true"
      SYNC_DB_LOCAL_PATH: /tmp/market-sentinel.db
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      LOG_LEVEL: INFO
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      HELIUS_WEBHOOK_URL: ${{ secrets.HELIUS_WEBHOOK_URL }}
      HELIUS_WEBHOOK_SECRET: ${{ secrets.HELIUS_WEBHOOK_SECRET }}
      SOLANA_INTEL_MAX_TOKENS: "30"
      SOLANA_INTEL_MAX_WALLETS: "50"
      SOLANA_INTEL_MONITOR_WALLETS: "25"
      SOLANA_INTEL_MIN_PROFITABLE_MEMECOINS: "3"
      SOLANA_INTEL_HISTORY_LIMIT: "500"
      SOLANA_INTEL_HISTORY_HOURS: "24"

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL não foi configurado"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY não foi configurado"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        run: python -m pip install .

      - name: Monitor continuously with bounded retries
        shell: bash
        run: |
          market-sentinel audit-failures

          deadline=$((SECONDS + 19800))
          # 2m30 cadence leaves another 2m30 recovery budget before the
          # dashboard can cross the five-minute freshness objective.
          cadence=150
          failures=0

          while (( SECONDS < deadline )); do
            cycle_started=$SECONDS
            succeeded=false

            for attempt in 1 2 3; do
              if market-sentinel once; then
                if ! market-sentinel solana-intel-once; then
                  echo "::warning::Coleta Solana falhou; o ciclo de futuros continuará normalmente"
                fi
                succeeded=true
                break
              fi
              failures=$((failures + 1))
              echo "::warning::Varredura falhou (tentativa ${attempt}/3); repetindo em 20 segundos"
              sleep 20
            done

            if [[ "$succeeded" != "true" ]]; then
              echo "::error::Três tentativas falharam; novo ciclo será iniciado sem esperar a cadência completa"
              continue
            fi

            elapsed=$((SECONDS - cycle_started))
            remaining=$((cadence - elapsed))
            if (( remaining > 0 && SECONDS + remaining < deadline )); then
              sleep "$remaining"
            fi
          done

          echo "Turno contínuo concluído com ${failures} tentativa(s) malsucedida(s)"

      - name: Verify remote database
        run: |
          python - <<'PY'
          import os
          import httpx

          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          headers = {"apikey": key}

          if not key.startswith("sb_secret_"):
              headers["Authorization"] = f"Bearer {key}"

          url = (
              f"{os.environ['SUPABASE_URL'].rstrip('/')}/storage/v1/object/"
              f"{os.environ['SUPABASE_STORAGE_BUCKET']}/"
              f"{os.environ['SUPABASE_DB_OBJECT']}"
          )

          response = httpx.get(url, headers=headers, timeout=30)

          if response.status_code != 200:
              raise SystemExit(
                  f"Banco remoto indisponível: HTTP {response.status_code} - "
                  f"{response.text[:500]}"
              )

          if not response.content.startswith(b"SQLite format 3"):
              raise SystemExit("O objeto remoto não é um banco SQLite válido")

          print(f"Banco remoto validado: {len(response.content)} bytes")
          PY
