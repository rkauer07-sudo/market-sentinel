[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sentinel"
version = "0.3.0"
description = "Read-only 24/7 crypto and tokenized-RWA opportunity monitor"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "eth-account>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
market-sentinel = "market_sentinel.cli:main"
market-sentinel-web = "market_sentinel.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_sentinel = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
