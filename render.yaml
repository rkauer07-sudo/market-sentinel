services:
  - type: web
    name: market-sentinel
    runtime: docker
    plan: starter
    region: ohio
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/sentinel.db
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_WEBHOOK_URL
        sync: false
      - key: HELIUS_WEBHOOK_SECRET
        generateValue: true
      - key: SOLANA_INTEL_MAX_TOKENS
        value: "12"
      - key: SOLANA_INTEL_MONITOR_WALLETS
        value: "25"
      - key: SOLANA_INTEL_MIN_PROFITABLE_MEMECOINS
        value: "3"
      - key: SOLANA_INTEL_CACHE_SECONDS
        value: "300"
      - key: LOG_LEVEL
        value: INFO
      - key: AUTOSTART
        value: "true"
    disk:
      name: sentinel-data
      mountPath: /var/data
      sizeGB: 1
